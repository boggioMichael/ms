# vision_bench.exe for Windows, built as MapleSyrup is (static C runtime),
# for timing the capture on a player's PC: `vision_bench --capture N` with
# the game open. Runs on a push to a bench/ branch; the program is the
# workflow's artifact.
name: Speed bench (Windows)
on:
  push:
    branches: ["bench/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          set -o pipefail
          cargo build --release --locked --bin vision_bench 2>&1 | tail -3
          mkdir -p out
          cp target/release/vision_bench.exe out/
          git rev-parse HEAD > out/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vision-bench-windows
          path: out
