name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version

      - name: Tesseract
        run: choco install tesseract -y --no-progress > /dev/null

      - name: Format
        run: cargo fmt --check

      # Findings are also printed as annotations, so they show on the run page.
      - name: Clippy
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings > clippy.txt 2>&1
          status=$?
          cat clippy.txt
          grep -E "(error|warning)(\[[A-Za-z0-9_]+\])?: " clippy.txt | grep -v "^error: could not compile" | awk '!seen[$0]++' | sed -n '1,10p' | sed 's/^/::error::/'
          exit $status

      # A failing test is named in an annotation too (with where it panicked
      # and why), so it shows on the run page and through the API.
      - name: Tests
        run: |
          set +e
          cargo test --release > tests.txt 2>&1
          status=$?
          cat tests.txt
          {
            grep -E "^test .* \.\.\. FAILED$" tests.txt
            awk '/panicked at/ { msg = $0; for (i = 0; i < 4 && (getline line) > 0; i++) { if (line ~ /^(note:|stack backtrace:)/ || line == "") break; msg = msg " | " line }; print msg }' tests.txt
          } | awk '!seen[$0]++' | sed -n '1,12p' | sed -e 's/%/%25/g' -e 's/^/::error::/'
          exit $status
