name: MapleSyrup standalone

# Builds and checks the standalone companion (MapleSyrup.exe) on master, a
# branch under claude/ or a version tag, and publishes what it made where it
# can be read with git:
#
#   build-output/<branch>   the Windows package (MapleSyrup.zip), the
#                           installer (MapleSyrup-Setup-<version>.exe) and
#                           every log
#   build-cache/vendor      the crates this tree depends on, for offline builds
#                           (only for a commit whose message says [vendor])
#
# A version tag (v0.9.0) also makes a draft GitHub release with the installer,
# the portable zip, the program alone and a signed manifest (`release` job).
# Running the workflow by hand on that tag with "publish" ticked publishes the
# release and sends the files to the company site, from where every
# MapleSyrup updates itself (src/update.rs). That needs:
#   secrets.RELEASE_SIGNING_KEY   the Ed25519 private key (PEM) whose public
#                                 half is built into the program
#   vars.SITE_REPO                the site's repository (owner/name)
#   secrets.SITE_TOKEN            a token that may push to it
#   vars.SITE_URL                 where the site is served (https://datta-syrup.ai)
#   vars.SITE_DOWNLOADS           the folder in the repository served as
#                                 /downloads/ (default: downloads)
# A commit message with [vendor-only] runs the vendor job alone.
on:
  push:
    branches: ["master", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: the GitHub release made public and the files sent to the site (run this on the version's tag)"
        type: boolean
        default: false
      notes:
        description: "A line about what is new, shown on the phone"
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  vendor:
    if: contains(github.event.head_commit.message, '[vendor')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor
        run: |
          set -o pipefail
          cargo vendor --versioned-dirs vendor > vendor-config.toml 2> vendor.log || { cat vendor.log; exit 1; }
          du -sh vendor
          out="$RUNNER_TEMP/cache"
          mkdir -p "$out"
          tar czf "$RUNNER_TEMP/vendor.tar.gz" vendor vendor-config.toml Cargo.lock
          # GitHub refuses files over 100 MB.
          split -b 90m -d "$RUNNER_TEMP/vendor.tar.gz" "$out/vendor.tar.gz.part-"
          cp Cargo.lock vendor-config.toml vendor.log "$out/"
          git rev-parse HEAD > "$out/commit.txt"
          ls -l "$out"
      - name: Publish
        run: |
          cd "$RUNNER_TEMP/cache"
          git init -q && git checkout -q -b cache
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "vendored crates [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "cache:refs/heads/build-cache/vendor"

  windows:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The C runtime linked in: MapleSyrup.exe runs on a PC without the
      # Visual C++ Redistributable.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain
        run: |
          mkdir -p logs
          { rustc --version; cargo --version; } | tee logs/toolchain.log
      - name: Format
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee logs/fmt.log
      - name: Clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee logs/clippy.log
      - name: Build
        run: |
          set -o pipefail
          cargo build --release --bins 2>&1 | tee logs/build.log
      - name: Tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee logs/test.log
          echo "TESTS PASSED: $(grep -oE '[0-9]+ passed' logs/test.log | awk '{s+=$1} END {print s}')" | tee -a logs/test.log
      - name: Self-test of the built program
        continue-on-error: true
        run: |
          set -o pipefail
          ./target/release/maplesyrup.exe --self-test 2>&1 | tee logs/self-test.log
      - name: Recording test (fetches ffmpeg the way a first recording does)
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "ffmpeg on the PATH: $(command -v ffmpeg || echo none)"
            status=0
            ./target/release/maplesyrup.exe --record-test || status=$?
            # Again with the settings in a folder named in Hebrew (a fresh
            # download there), like a user folder can be.
            echo "--- settings in a Hebrew-named folder"
            MAPLESYRUP_HOME="$(cygpath -w "$RUNNER_TEMP")\\בית" ./target/release/maplesyrup.exe --record-test || status=$?
            # What this machine's screen gives ffmpeg directly.
            ff="$(cygpath -u "$APPDATA")/MapleSyrup/ffmpeg/ffmpeg.exe"
            if [ -f "$ff" ]; then
              "$ff" -version | head -1
              echo "--- gdigrab"; "$ff" -hide_banner -loglevel info -f gdigrab -framerate 30 -t 2 -i desktop -y "$RUNNER_TEMP/gdi.mp4" 2>&1 | tail -6
              echo "--- ddagrab"; "$ff" -hide_banner -loglevel info -f lavfi -t 2 -i "ddagrab=output_idx=0:framerate=30,hwdownload,format=bgra" -y "$RUNNER_TEMP/dda.mp4" 2>&1 | tail -6
            fi
            exit $status
          } 2>&1 | tee logs/record-test.log
      - name: Package
        run: |
          pkg="$RUNNER_TEMP/MapleSyrup"
          mkdir -p "$pkg"
          cp target/release/maplesyrup.exe "$pkg/MapleSyrup.exe"
          cp target/release/vision_debug.exe "$pkg/"
          if [ -d package ]; then cp -r package/. "$pkg/"; fi
          (cd "$RUNNER_TEMP" && 7z a -tzip MapleSyrup.zip MapleSyrup > /dev/null)
          ls -l "$RUNNER_TEMP/MapleSyrup.zip" | tee logs/package.log
          sha256sum "$RUNNER_TEMP/MapleSyrup.zip" | tee -a logs/package.log
      - name: Installer
        run: |
          set -o pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress > logs/innosetup.log 2>&1; fi
          MSYS_NO_PATHCONV=1 "$iscc" /Q "/DAppVersion=$version" "/DSourceDir=$(cygpath -w "$RUNNER_TEMP/MapleSyrup")" "/O$(cygpath -w "$RUNNER_TEMP")" installer/MapleSyrup.iss 2>&1 | tee logs/installer.log
          ls -l "$RUNNER_TEMP"/MapleSyrup-Setup-*.exe | tee -a logs/installer.log
          sha256sum "$RUNNER_TEMP"/MapleSyrup-Setup-*.exe | tee -a logs/installer.log
      - name: Installer test (install, run, uninstall)
        continue-on-error: true
        run: |
          set -o pipefail
          {
            setup=$(ls "$RUNNER_TEMP"/MapleSyrup-Setup-*.exe)
            MSYS_NO_PATHCONV=1 "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/LOG=$(cygpath -w "$RUNNER_TEMP/setup.log")"
            app="$(cygpath -u "$LOCALAPPDATA")/Programs/MapleSyrup"
            menu="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/MapleSyrup"
            ls -l "$app" "$menu"
            test -f "$app/MapleSyrup.exe" && echo "INSTALLED: $app"
            echo "sessions folder: $(cat "$app/sessions-folder.txt")"
            test -f "$menu/MapleSyrup.lnk" && echo "SHORTCUT: MapleSyrup.lnk"
            "$app/MapleSyrup.exe" --self-test && echo "INSTALLED COPY: self-test passed"
            MSYS_NO_PATHCONV=1 "$app/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            for i in $(seq 1 30); do [ -f "$app/MapleSyrup.exe" ] || break; sleep 1; done
            if [ -f "$app/MapleSyrup.exe" ]; then echo "UNINSTALL: files left"; exit 1; else echo "UNINSTALLED"; fi
          } 2>&1 | tee logs/installer-test.log
      - name: Publish
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp -r logs "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/MapleSyrup.zip" "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/MapleSyrup-Setup-*.exe "$out/" 2>/dev/null || true
          git rev-parse HEAD > "$out/commit.txt"
          echo "${{ job.status }}" > "$out/status.txt"
          cd "$out"
          git init -q && git checkout -q -b out
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "windows build of $(cat commit.txt) [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "out:refs/heads/build-output/$GITHUB_REF_NAME/windows"
      - name: Keep the package for the release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            ${{ runner.temp }}/MapleSyrup.zip
            ${{ runner.temp }}/MapleSyrup-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  # The release: the files laid out under their version's names, a signed
  # manifest for the updater, a GitHub release (a draft on a tag; public
  # when published), and, when published, the files on the company site.
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH: ${{ inputs.publish && 'yes' || 'no' }}
      NOTES: ${{ inputs.notes }}
      SITE_URL: ${{ vars.SITE_URL || 'https://datta-syrup.ai' }}
      SITE_DOWNLOADS: ${{ vars.SITE_DOWNLOADS || 'downloads' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: package
      - name: Lay the files out
        id: files
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF" in
            refs/tags/v*)
              tagged="${GITHUB_REF_NAME#v}"
              if [ "$tagged" != "$version" ]; then
                echo "the tag says $tagged but Cargo.toml says $version: the program would report the wrong version to the updater" >&2
                exit 1
              fi;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp package/MapleSyrup-Setup-*.exe "release/MapleSyrup-Setup-$version.exe"
          cp package/MapleSyrup.zip "release/MapleSyrup-$version-portable.zip"
          unzip -q -j package/MapleSyrup.zip MapleSyrup/MapleSyrup.exe -d release
          mv release/MapleSyrup.exe "release/MapleSyrup-$version.exe"
          (cd release && sha256sum *.exe *.zip > SHA256SUMS && cat SHA256SUMS)
      - name: The manifest, signed
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          HAS_SITE: ${{ secrets.SITE_TOKEN != '' && vars.SITE_REPO != '' }}
        run: |
          set -euo pipefail
          version="${{ steps.files.outputs.version }}"
          # The files are fetched from the site when it is set up to take
          # them, else from the GitHub release.
          if [ "$HAS_SITE" = true ]; then
            base="$SITE_URL/$SITE_DOWNLOADS"
          else
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          fi
          python3 - "$version" "$base" <<'PY'
          import hashlib, json, os, sys, datetime
          version, base = sys.argv[1], sys.argv[2]
          def entry(name, kind):
              path = os.path.join("release", name)
              with open(path, "rb") as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              return {"name": name, "kind": kind, "size": os.path.getsize(path), "sha256": digest, "url": f"{base}/{name}"}
          manifest = {
              "name": "MapleSyrup",
              "version": version,
              "published": datetime.date.today().isoformat(),
              "commit": os.environ["GITHUB_SHA"],
              "notes": os.environ.get("NOTES", ""),
              "files": [
                  entry(f"MapleSyrup-{version}.exe", "exe"),
                  entry(f"MapleSyrup-Setup-{version}.exe", "installer"),
                  entry(f"MapleSyrup-{version}-portable.zip", "portable"),
              ],
          }
          with open("release/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set: the manifest is not signed, and no MapleSyrup will take this release as an update"
            exit 0
          fi
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in release/manifest.json -out release/manifest.json.sig
          rm -f "$key"
          # The public half, for the record: it must be the one in src/update.rs.
          echo "signed with the key whose public half is:"
          openssl pkey -in <(printf '%s\n' "$RELEASE_SIGNING_KEY") -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n'; echo
          ls -l release
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.files.outputs.version }}"
          tag="v$version"
          files=$(ls release/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "MapleSyrup $tag" \
              --notes-file installer/release-notes.md $files
          fi
          if [ "$PUBLISH" = yes ]; then
            gh release edit "$tag" --draft=false
            echo "published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          else
            echo "a draft: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag (run the workflow on the tag with publish ticked)"
          fi
      - name: The company site
        if: env.PUBLISH == 'yes'
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_TOKEN" ] || [ -z "$SITE_REPO" ]; then
            echo "::warning::SITE_REPO (a repository variable) and SITE_TOKEN (a secret) are not both set: nothing sent to the site"
            exit 0
          fi
          if [ ! -f release/manifest.json.sig ]; then
            echo "the manifest is not signed: not sending an update nobody will take" >&2
            exit 1
          fi
          version="${{ steps.files.outputs.version }}"
          git clone -q --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}" site
          dest="site/$SITE_DOWNLOADS"
          mkdir -p "$dest"
          cp release/* "$dest/"
          # Fixed names too, so the site's links need no change per version.
          cp "release/MapleSyrup-Setup-$version.exe" "$dest/MapleSyrup-Setup.exe"
          cp "release/MapleSyrup-$version-portable.zip" "$dest/MapleSyrup-portable.zip"
          cd site
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A "$SITE_DOWNLOADS"
          if git diff --cached --quiet; then echo "the site already has $version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "MapleSyrup $version"
          git push -q origin HEAD
          echo "sent to $SITE_REPO/$SITE_DOWNLOADS: $(ls "$SITE_DOWNLOADS" | tr '\n' ' ')"
          echo "the updater reads $SITE_URL/$SITE_DOWNLOADS/manifest.json"

  linux:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg and Xvfb (recording tests)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb > /dev/null
      - name: Checks
        continue-on-error: true
        run: |
          set +e
          mkdir -p logs
          cargo fmt --check 2>&1 | tee logs/fmt.log
          cargo clippy --all-targets -- -D warnings 2>&1 | tee logs/clippy.log
          cargo test --release 2>&1 | tee logs/test.log
          echo "TESTS PASSED: $(grep -oE '[0-9]+ passed' logs/test.log | awk '{s+=$1} END {print s}')" | tee -a logs/test.log
      - name: Publish
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp -r logs "$out/" 2>/dev/null || true
          git rev-parse HEAD > "$out/commit.txt"
          cd "$out"
          git init -q && git checkout -q -b out
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "linux checks of $(cat commit.txt) [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "out:refs/heads/build-output/$GITHUB_REF_NAME/linux"
